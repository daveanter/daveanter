<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule Submitted</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body { background:#f0f4f8; display:flex; align-items:center; min-height:100vh; }</style>
</head>
<body>
<div class="container text-center py-5" style="max-width:460px;">
  <div style="font-size:3.5rem;">✅</div>
  <h2 class="mt-3 fw-bold" style="color:#1F4E79;">Thanks, {{ name }}!</h2>
  <p class="text-muted mt-2">
    Your preferred schedule for the week of
    <strong>{{ week_start.strftime('%B %d, %Y') }}</strong>
    has been sent to your manager for review.
  </p>
  <p class="text-muted" style="font-size:.85rem;">You can close this window.</p>
</div>
</body>
</html>
