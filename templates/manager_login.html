<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manager Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f0f4f8; display:flex; align-items:center; min-height:100vh; }
    .card { border:none; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.1); }
  </style>
</head>
<body>
<div class="container" style="max-width:380px;">
  <div class="text-center mb-4">
    <div style="background:#1F4E79;color:#fff;border-radius:50%;width:56px;height:56px;
                line-height:56px;font-size:1.5rem;margin:0 auto 12px;">🗓</div>
    <h2 style="color:#1F4E79;font-weight:700;">Shift Scheduler</h2>
    <p class="text-muted">Manager access</p>
  </div>
  <div class="card p-4">
    {% if error %}
    <div class="alert alert-danger py-2 mb-3">{{ error }}</div>
    {% endif %}
    <form method="post">
      <label class="form-label text-muted small">Password</label>
      <input type="password" name="password" class="form-control mb-3"
             placeholder="Enter manager password" autofocus>
      <button type="submit" class="btn w-100 fw-bold"
              style="background:#1F4E79;color:#fff;border-radius:8px;padding:12px;">
        Sign In
      </button>
    </form>
  </div>
</div>
</body>
</html>
