<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule Approved</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body { background:#f0f4f8; display:flex; align-items:center; min-height:100vh; }</style>
</head>
<body>
<div class="container text-center py-5" style="max-width:460px;">
  <div style="font-size:3.5rem; color:#2E7D32;">✓</div>
  <h2 class="mt-3 fw-bold" style="color:#2E7D32;">Approved!</h2>
  <p class="text-muted mt-2">
    <strong>{{ name }}'s</strong> schedule for the week of
    <strong>{{ week_start.strftime('%B %d, %Y') }}</strong> is confirmed.
  </p>
  <div class="card border-0 shadow-sm mt-3 text-start" style="background:#E2EFDA; color:#375623;">
    <div class="card-body">
      <div class="fw-bold mb-2">Monday – Friday</div>
      <div>Start: <strong>{{ start_time }}</strong></div>
      <div>Finish: <strong>{{ end_time }}</strong></div>
      <div>Lunch: <strong>{{ lunch_mins }} minutes</strong></div>
    </div>
  </div>
  <p class="text-muted mt-3" style="font-size:.85rem;">You can close this window.</p>
</div>
</body>
</html>
